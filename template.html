<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      width: 800px;
      height: 400px;
      background-color: #2b2d42;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: Arial, sans-serif;
      padding: 40px;
      box-sizing: border-box;
    }
    .text-area {
      color: white;
      max-width: 400px;
    }
    #banner-title {
      font-size: 42px;
      margin: 0 0 10px 0;
    }
    #banner-price {
      font-size: 32px;
      color: #ef233c;
      margin: 0;
    }
    #banner-image {
      max-width: 300px;
      max-height: 300px;
      object-fit: contain;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="text-area">
    <h1 id="banner-title">Product Name</h1>
    <p id="banner-price">$0.00</p>
  </div>
  <img id="banner-image" src="" />
</body>
</html>
