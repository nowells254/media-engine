<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Media Engine</title>
  <style>
    :root { --brand:#4361ee; --dark:#2b2d42; --border:#e2e4ec; --radius:10px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(135deg,#4361ee 0%,#7209b7 55%,#f72585 100%); color:var(--dark); display:flex; align-items:center; justify-content:center; padding:32px 16px; }
    .wrap { width:100%; max-width:420px; }
    .brand { text-align:center; color:white; margin-bottom:18px; }
    .brand h1 { margin:0; font-size:28px; }
    .brand p { margin:6px 0 0; opacity:.9; font-size:14px; }
    .card { background:white; border-radius:16px; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    label { display:block; font-size:13px; font-weight:600; margin-top:12px; }
    input { width:100%; padding:12px 14px; margin-top:6px; font-size:15px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; }
    input:focus { outline:none; border-color:var(--brand); }
    button { width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:700; color:white; border:none; border-radius:var(--radius); cursor:pointer; background:linear-gradient(90deg,#4361ee,#7209b7); }
    button:disabled { opacity:.6; cursor:wait; }
    #authStatus { margin-top:14px; font-size:14px; text-align:center; color:#ef233c; }
    .foot { text-align:center; margin-top:16px; font-size:14px; color:white; }
    .foot a { color:white; font-weight:700; }
    .small { text-align:center; margin-top:22px; font-size:13px; }
    .small a { color:rgba(255,255,255,.8); text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>Media Engine</h1>
      <p>Welcome back</p>
    </div>

    <div class="card">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      <button id="loginBtn" onclick="login()">Log in</button>
      <div id="authStatus"></div>
    </div>

    <div class="foot">New here? <a href="/signup.html">Create an account</a></div>
    <div class="small"><a href="/">&larr; Back to home</a> &nbsp;|&nbsp; <a href="/support.html">Support</a> &nbsp;|&nbsp; <a href="/privacy.html">Privacy</a> &nbsp;|&nbsp; <a href="/terms.html">Terms</a></div>
  </div>

  <script>
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function login() {
      const status = document.getElementById('authStatus');
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      status.innerText = '';
      if (!email || !password) { status.innerText = 'Please enter your email and password.'; return; }

      btn.disabled = true;
      btn.innerText = 'Logging in...';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('mediaEngineToken', data.session.access_token);
          window.location.href = '/dashboard.html';
        } else {
          status.innerText = data.error || 'Login failed.';
          btn.disabled = false;
          btn.innerText = 'Log in';
        }
      } catch (e) {
        status.innerText = 'Could not reach the server. Please try again.';
        btn.disabled = false;
        btn.innerText = 'Log in';
      }
    }
  </script>
</body>
</html>
