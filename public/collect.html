<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your details - Media Engine</title>
  <style>
    :root { --brand:#4361ee; --dark:#2b2d42; --border:#e2e4ec; --radius:10px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,Arial,sans-serif; background:linear-gradient(135deg,#4361ee 0%,#7209b7 55%,#f72585 100%); color:var(--dark); padding:28px 14px; }
    .wrap { max-width:520px; margin:0 auto; }
    .brand { text-align:center; color:white; margin-bottom:16px; }
    .brand h1 { margin:0; font-size:26px; }
    .card { background:white; border-radius:16px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.25); margin-bottom:16px; }
    h2 { margin:0 0 6px; font-size:22px; }
    h3 { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:#7209b7; margin:20px 0 4px; }
    .note { color:#555; font-size:14px; margin:4px 0 8px; white-space:pre-line; }
    .lbl { display:block; font-size:13px; font-weight:600; margin-top:14px; }
    input[type=text], textarea { width:100%; padding:12px 14px; margin:6px 0; font-size:16px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; }
    input[type=file] { width:100%; margin:6px 0; font-size:14px; }
    input:focus, textarea:focus { outline:none; border-color:var(--brand); }
    .hint { font-size:12px; color:#888; }
    .chk { display:flex; gap:10px; align-items:flex-start; margin-top:18px; font-size:13px; line-height:1.5; }
    .chk input { margin-top:3px; }
    button { width:100%; margin-top:18px; padding:14px; font-size:16px; font-weight:700; color:white; border:none; border-radius:var(--radius); cursor:pointer; background:linear-gradient(90deg,#4361ee,#7209b7); }
    button:disabled { opacity:.6; cursor:wait; }
    #msg { margin-top:12px; font-size:14px; color:#ef233c; text-align:center; }
    .thumb { height:70px; border-radius:8px; border:1px solid var(--border); display:block; margin-top:6px; }
    .live { margin:8px auto 0; overflow:hidden; background:#eceef6; border-radius:10px; position:relative; border:1px solid var(--border); }
    .icon { width:60px; height:60px; border-radius:50%; background:#0a9e6e; color:white; font-size:32px; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; }
    .center { text-align:center; }
    .foot { text-align:center; color:rgba(255,255,255,.85); font-size:12px; }
    .foot a { color:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><h1>Media Engine</h1></div>
    <div class="card" id="main"><p>Loading...</p></div>
    <div class="card" id="previewCard" style="display:none;"><h2>Preview</h2><div class="live" id="live"></div></div>
    <p class="foot"><a href="/privacy.html">Privacy Policy</a> &nbsp;|&nbsp; <a href="/terms.html">Terms of Service</a></p>
  </div>

  <script src="/designs.js"></script>
  <script src="/i18n.js"></script>
  <script>
    if (window.ME_DICT) {
      Object.assign(window.ME_DICT, {
        'Your details': '您的资料', 'Submit': '提交', 'Preview': '预览',
        'Thank you! Your details have been sent.': '谢谢!您的资料已发送。',
        'You can close this page now.': '您现在可以关闭此页面。',
        'This form was not found.': '未找到该表单。', 'This form is closed.': '该表单已关闭。', 'This form is full.': '该表单已满。',
        'Your email or phone (optional)': '您的邮箱或电话(可选)',
        'This is only used to contact you and is not printed.': '仅用于联系您,不会印在文档上。',
        'I agree that my details may be used to produce this document, as described in the': '我同意我的资料用于制作此文档,详见',
        'Please accept to continue.': '请先勾选同意。',
        'Photos are not requested on this form.': '该表单不需要上传照片。',
        'That image is too large.': '图片太大。',
        'Please fill in the required details.': '请填写必填资料。',
        'This form cannot accept more photos.': '该表单无法再接收更多照片。',
        'Please upload a PNG or JPG image.': '请上传 PNG 或 JPG 图片。',
        'That file is not a valid PNG or JPG image.': '该文件不是有效的 PNG 或 JPG 图片。'
      });
      if (window.ME_REAPPLY) window.ME_REAPPLY();
    }

    const DS = window.Designs;
    const token = new URLSearchParams(location.search).get('r') || '';
    const $ = id => document.getElementById(id);
    const MAIN = { certificate: 'recipient', business_card: 'name', id_card: 'name', poster: 'headline', banner: 'headline' };
    let req = null, previewTimer = null;
    const values = {};

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function note(msg) { $('main').innerHTML = '<p>' + esc(msg) + '</p>'; }
    function head(r) { return '<h2 translate="no">' + esc(r.title) + '</h2>' + (r.note ? '<p class="note" translate="no">' + esc(r.note) + '</p>' : ''); }

    async function init() {
      if (!token) { note('This form was not found.'); return; }
      let r;
      try { r = await (await fetch('/api/collect/' + encodeURIComponent(token))).json(); }
      catch (e) { note('Could not reach the server. Please try again.'); return; }
      if (!r.success || !r.found) { note('This form was not found.'); return; }
      if (r.state !== 'open') {
        $('main').innerHTML = head(r) + '<p>' + (r.state === 'full' ? 'This form is full.' : 'This form is closed.') + '</p>';
        return;
      }
      req = r;
      render();
    }

    function render() {
      const prod = DS.PRODUCTS[req.design.product];
      let h = head(req) + '<h3>Your details</h3>';
      req.ask.forEach(key => {
        const fd = prod.fields.find(f => f.key === key);
        if (!fd) return;
        h += '<label class="lbl">' + fd.label + '</label>';
        if (fd.type === 'image') {
          h += '<div id="ph_' + key + '"></div><input type="file" accept="image/png,image/jpeg" onchange="pick(\'' + key + '\', this)"><div class="hint" id="st_' + key + '">' + fd.hint + '</div>';
        } else if (fd.type === 'textarea') {
          h += '<textarea rows="3" maxlength="500" oninput="setVal(\'' + key + '\', this.value)"></textarea>';
        } else {
          h += '<input type="text" maxlength="120" oninput="setVal(\'' + key + '\', this.value)">';
        }
      });
      h += '<label class="lbl">Your email or phone (optional)</label><input type="text" id="contact" maxlength="120">' +
        '<div class="hint">This is only used to contact you and is not printed.</div>' +
        '<input type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;">' +
        '<label class="chk"><input type="checkbox" id="agree"> <span>I agree that my details may be used to produce this document, as described in the <a href="/privacy.html" target="_blank">Privacy Policy</a>.</span></label>' +
        '<button id="go" onclick="send()">Submit</button><div id="msg"></div>';
      $('main').innerHTML = h;
      $('previewCard').style.display = '';
      preview();
    }

    function setVal(k, v) { values[k] = v; preview(); }

    function preview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        const p = DS.PRODUCTS[req.design.product];
        const box = $('live');
        const avail = Math.max(200, box.parentElement.clientWidth - 48);
        const scale = Math.min(1, avail / p.w);
        box.style.width = Math.round(p.w * scale) + 'px';
        box.style.height = Math.round(p.h * scale) + 'px';
        const f = document.createElement('iframe');
        f.setAttribute('sandbox', '');
        f.style.cssText = 'width:' + p.w + 'px;height:' + p.h + 'px;border:0;transform:scale(' + scale + ');transform-origin:top left;pointer-events:none;background:#fff;position:absolute;top:0;left:0;';
        f.srcdoc = DS.build({
          product: req.design.product, style: req.design.style, lang: req.design.lang, colors: req.design.colors,
          fields: Object.assign({}, req.design.shared, values)
        }, { origin: location.origin });
        box.innerHTML = '';
        box.appendChild(f);
      }, 150);
    }

    function shrink(file, maxSide) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const k = Math.min(1, maxSide / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(new Error('Could not read that image.'));
        img.src = url;
      });
    }

    async function pick(key, input) {
      const file = input.files[0];
      if (!file) return;
      const st = $('st_' + key);
      st.innerText = 'Uploading...';
      try {
        const dataUrl = await shrink(file, 600);
        const r = await (await fetch('/api/collect/' + encodeURIComponent(token) + '/upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataUrl })
        })).json();
        if (!r.success) throw new Error(r.error);
        values[key] = r.url;
        $('ph_' + key).innerHTML = '<img class="thumb" src="' + esc(r.url) + '">';
        st.innerText = '';
        preview();
      } catch (e) { st.innerText = e.message || 'Upload failed.'; }
    }

    async function send() {
      const msg = $('msg');
      msg.innerText = '';
      const main = MAIN[req.design.product];
      if (req.ask.includes(main) && !String(values[main] || '').trim()) {
        msg.innerText = (main === 'recipient' || main === 'name') ? 'Please enter your name.' : 'Please fill in the required details.';
        return;
      }
      if (!$('agree').checked) { msg.innerText = 'Please accept to continue.'; return; }
      const btn = $('go');
      btn.disabled = true; btn.innerText = 'Sending...';
      try {
        const r = await (await fetch('/api/collect/' + encodeURIComponent(token) + '/submit', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: values, contact: $('contact').value, website: $('hp').value })
        })).json();
        if (r.success) {
          $('previewCard').style.display = 'none';
          $('main').innerHTML = '<div class="center"><div class="icon">&#10003;</div><h2>Thank you! Your details have been sent.</h2><p>You can close this page now.</p></div>';
          return;
        }
        msg.innerText = r.error || 'Something went wrong. Please try again.';
      } catch (e) { msg.innerText = 'Could not reach the server. Please try again.'; }
      btn.disabled = false; btn.innerText = 'Submit';
    }

    init();
  </script>
</body>
</html>
