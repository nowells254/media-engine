<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password - Media Engine</title>
  <style>
    :root { --brand:#4361ee; --dark:#2b2d42; --border:#e2e4ec; --radius:10px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(135deg,#4361ee 0%,#7209b7 55%,#f72585 100%); color:var(--dark); display:flex; align-items:center; justify-content:center; padding:32px 16px; }
    .wrap { width:100%; max-width:420px; }
    .brand { text-align:center; color:white; margin-bottom:18px; }
    .brand h1 { margin:0; font-size:28px; }
    .brand p { margin:6px 0 0; opacity:.9; font-size:14px; }
    .card { background:white; border-radius:16px; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    label { display:block; font-size:13px; font-weight:600; margin-top:12px; }
    label:first-child { margin-top:0; }
    input { width:100%; padding:12px 14px; margin-top:6px; font-size:15px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; }
    input:focus { outline:none; border-color:var(--brand); }
    button { width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:700; color:white; border:none; border-radius:var(--radius); cursor:pointer; background:linear-gradient(90deg,#4361ee,#7209b7); }
    button:disabled { opacity:.6; cursor:wait; }
    #msg { margin-top:14px; font-size:14px; text-align:center; color:#ef233c; line-height:1.5; }
    .foot { text-align:center; margin-top:16px; font-size:14px; color:white; }
    .foot a { color:white; font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>Media Engine</h1>
      <p>Choose a new password</p>
    </div>
    <div class="card" id="card">
      <div id="form">
        <label>New password</label>
        <input id="pw" type="password" placeholder="At least 8 characters" autocomplete="new-password">
        <label>Confirm new password</label>
        <input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password">
        <button id="saveBtn" onclick="save()">Save new password</button>
        <div id="msg"></div>
      </div>
    </div>
    <div class="foot"><a href="/login.html">&larr; Back to log in</a></div>
  </div>

  <script>
    const params = new URLSearchParams(location.hash.substring(1));
    const accessToken = params.get('access_token');

    if (!accessToken) {
      document.getElementById('card').innerHTML =
        '<div style="text-align:center;line-height:1.6;">This reset link is invalid or has expired.<br><br>' +
        '<a href="/forgot.html" style="color:#4361ee;font-weight:700;">Request a new link</a></div>';
    }

    async function save() {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('saveBtn');
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw.length < 8) { msg.innerText = 'Password must be at least 8 characters.'; return; }
      if (pw !== pw2) { msg.innerText = 'The two passwords do not match.'; return; }
      btn.disabled = true;
      btn.innerText = 'Saving...';
      try {
        const res = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, newPassword: pw })
        });
        const data = await res.json();
        if (data.success) {
          history.replaceState(null, '', '/reset.html');
          document.getElementById('card').innerHTML =
            '<div style="text-align:center;padding:10px 0;"><div style="font-size:52px;">&#9989;</div>' +
            '<h2 style="margin:10px 0;">Password updated</h2>' +
            '<a href="/login.html" style="display:inline-block;margin-top:10px;padding:12px 28px;border-radius:10px;background:linear-gradient(90deg,#4361ee,#7209b7);color:white;font-weight:700;text-decoration:none;">Go to log in</a></div>';
        } else {
          msg.innerText = data.error || 'Something went wrong.';
          btn.disabled = false;
          btn.innerText = 'Save new password';
        }
      } catch (e) {
        msg.innerText = 'Could not reach the server. Please try again.';
        btn.disabled = false;
        btn.innerText = 'Save new password';
      }
    }
  </script>
</body>
</html>
