<!DOCTYPE html>
<html>
<head>
  <title>Media Engine - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #4361ee;
      --brand-dark: #2b2d42;
      --bg: #f7f8fc;
      --border: #e2e4ec;
      --radius: 10px;
      --danger: #ef233c;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      color: var(--brand-dark);
    }
    input, select {
      display: block; width: 100%; margin: 8px 0; padding: 12px 14px;
      box-sizing: border-box; font-size: 15px; border: 1px solid var(--border);
      border-radius: var(--radius); font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); }
    button {
      display: block; width: 100%; margin: 10px 0 0; padding: 13px;
      box-sizing: border-box; font-size: 15px; font-weight: 600; border: none;
      border-radius: var(--radius); cursor: pointer; font-family: inherit;
      background: var(--brand); color: white; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    #result img { max-width: 100%; margin-top: 15px; border-radius: var(--radius); }

    .card {
      background: white; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; box-shadow: 0 4px 20px rgba(43,45,66,0.05);
    }
    h2 { margin-top: 0; font-size: 18px; }

    .usage-bar { background: var(--border); border-radius: 6px; height: 10px; overflow: hidden; margin: 10px 0; }
    .usage-fill { background: var(--brand); height: 100%; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 18px; margin-bottom: 24px;
    }
    .topbar h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .topbar button { width: auto; background: #eef0f7; color: var(--brand-dark); padding: 9px 18px; margin: 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 11px; text-align: center; background: white;
      border: 1px solid var(--border); color: var(--brand-dark); border-radius: var(--radius);
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s;
    }
    .tab-btn.active { background: var(--brand-dark); color: white; border-color: var(--brand-dark); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 10px; }
    .gallery-card {
      border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden;
      cursor: pointer; background: white; transition: border-color 0.15s;
    }
    .gallery-card:hover { border-color: #b8c2f0; }
    .gallery-card.selected { border-color: var(--brand); }
    .thumb-wrap { width: 100%; height: 110px; overflow: hidden; background: #f0f1f5; position: relative; }
    .thumb-frame { position: absolute; top: 0; left: 0; border: none; pointer-events: none; }
    .gallery-card .label { padding: 8px 10px; font-size: 13px; font-weight: 600; }

    .preset-preview { width: 100%; height: 140px; overflow: hidden; background: #f0f1f5; border-radius: var(--radius); position: relative; margin-top: 8px; }
    .preset-preview iframe { position: absolute; top: 0; left: 0; border: none; pointer-events: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>Media Engine</h1>
    <button onclick="logout()">Log Out</button>
  </div>

  <div class="tabs">
    <div class="tab-btn active" onclick="showTab('subscribeTab', this)">Subscribe</div>
    <div class="tab-btn" onclick="showTab('templatesTab', this)">Templates</div>
    <div class="tab-btn" onclick="showTab('generateTab', this)">Generate</div>
  </div>

  <div id="subscribeTab" class="tab-content active card">
    <h2>Subscription</h2>
    <select id="planSelect">
      <option value="starter" data-amount="10">Starter - KES 10 (test)</option>
    </select>
    <button onclick="subscribe()">Subscribe Now</button>
    <p id="subscribeStatus"></p>
    <div id="usageDisplay"></div>
  </div>

  <div id="templatesTab" class="tab-content card">
    <h2>My Templates</h2>
    <div id="templateList" class="gallery"><p>Loading...</p></div>

    <h2 style="margin-top:28px;">Create a New Template</h2>
    <input type="text" id="newTemplateName" placeholder="Template name (e.g. Summer Sale Banner)">
    <select id="presetSelect" onchange="updatePresetPreview()">
      <option value="banner">Product Banner</option>
      <option value="certificate">Certificate</option>
      <option value="poster">Event Poster</option>
      <option value="quote">Quote Card</option>
    </select>
    <div class="preset-preview" id="presetPreviewBox"></div>
    <button onclick="createTemplate()">Save Template</button>
    <p id="templateStatus"></p>
  </div>

  <div id="generateTab" class="tab-content card">
    <h2>Generate an Image</h2>
    <p id="selectedTemplateLabel" style="color:#888; font-size:14px;">Select a template in the Templates tab first.</p>
    <input type="text" id="title" placeholder="Title" value="My Banner">
    <input type="text" id="price" placeholder="Subtitle / Price / Date">
    <input type="text" id="imageUrl" placeholder="Image URL (optional)">
    <button onclick="generate()">Generate</button>
    <div id="result"></div>
    <div id="buyCreditsSection" style="display:none; margin-top:15px;">
      <p style="color:var(--danger);">You've used all your included generations for this plan.</p>
      <button onclick="buyCredits()">Buy 100 More Generations - KES 20 (test)</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('mediaEngineToken') || '';
    let selectedTemplateId = null;

    if (!token) {
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.removeItem('mediaEngineToken');
      window.location.href = '/login.html';
    }

    function showTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    const PRESETS = {
      banner: "<html><body style='margin:0;width:800px;height:400px;background:#2b2d42;display:flex;align-items:center;justify-content:space-between;font-family:Arial;padding:40px;box-sizing:border-box;'><div style='color:white;'><h1>{{title}}</h1><p style='color:#ef233c;font-size:32px;'>{{price}}</p></div><img src='{{imageUrl}}' style='max-width:300px;border-radius:12px;' /></body></html>",
      certificate: "<html><body style='margin:0;width:900px;height:650px;background:linear-gradient(135deg,#fdfaf3,#f5ecd7);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif;border:14px double #c9a24b;box-sizing:border-box;padding:50px;'><p style='letter-spacing:5px;color:#c9a24b;font-size:16px;margin:0;'>CERTIFICATE OF ACHIEVEMENT</p><div style='width:3px;height:20px;background:#c9a24b;margin:15px auto;'></div><p style='font-size:16px;color:#888;margin:0;'>This certificate is proudly presented to</p><h1 style='font-size:48px;color:#2b2d42;margin:15px 0;'>{{title}}</h1><p style='font-size:18px;color:#555;margin:0 0 25px;'>{{price}}</p><div style='width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f4d78b,#c9a24b 75%);border:4px solid #fff;box-shadow:0 0 0 2px #c9a24b,0 6px 14px rgba(0,0,0,0.25);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b2d42;font-weight:bold;'><div style='font-size:13px;letter-spacing:1px;'>PINNACLE</div><div style='font-size:11px;letter-spacing:1px;'>EDGE LTD</div><div style='font-size:15px;margin-top:2px;'>&#9733;</div></div></body></html>",
      poster: "<html><body style='margin:0;width:600px;height:800px;background:linear-gradient(135deg,#7209b7,#3a0ca3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Arial;color:white;box-sizing:border-box;padding:40px;'><img src='{{imageUrl}}' style='width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:30px;' /><h1 style='font-size:48px;margin:0;'>{{title}}</h1><p style='font-size:24px;margin-top:15px;'>{{price}}</p></body></html>",
      quote: "<html><body style='margin:0;width:800px;height:500px;background:#1d1d2c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif;color:white;padding:60px;box-sizing:border-box;'><p style='font-size:36px;line-height:1.4;'>\u201c{{title}}\u201d</p><img src='{{imageUrl}}' style='width:60px;height:60px;border-radius:50%;margin-top:30px;object-fit:cover;' /><p style='font-size:18px;color:#aaa;margin-top:10px;'>{{price}}</p></body></html>"
    };

    function extractDims(html) {
      const w = html.match(/width:\s*(\d+)px/);
      const h = html.match(/height:\s*(\d+)px/);
      return { width: w ? parseInt(w[1]) : 800, height: h ? parseInt(h[1]) : 600 };
    }

    function fillSample(html) {
      const sampleImg = window.location.origin + '/assets/logo.png';
      return html
        .replace(/{{title}}/g, 'Sample Title')
        .replace(/{{price}}/g, '$29.99')
        .replace(/{{imageUrl}}/g, sampleImg);
    }

    function buildThumbnail(html, boxWidth, boxHeight) {
      const dims = extractDims(html);
      const scale = Math.min(boxWidth / dims.width, boxHeight / dims.height);
      const iframe = document.createElement('iframe');
      iframe.className = 'thumb-frame';
      iframe.style.width = dims.width + 'px';
      iframe.style.height = dims.height + 'px';
      iframe.style.transform = `scale(${scale})`;
      iframe.style.transformOrigin = 'top left';
      iframe.srcdoc = fillSample(html);
      return iframe;
    }

    function updatePresetPreview() {
      const preset = document.getElementById('presetSelect').value;
      const box = document.getElementById('presetPreviewBox');
      box.innerHTML = '';
      box.appendChild(buildThumbnail(PRESETS[preset], box.clientWidth || 300, 140));
    }

    async function subscribe() {
      const select = document.getElementById('planSelect');
      const plan = select.value;
      const amount = select.selectedOptions[0].dataset.amount;

      const res = await fetch(`${API_BASE}/subscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ plan, amount: parseInt(amount) })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('subscribeStatus').innerText = 'Redirecting to payment...';
        window.location.href = data.authorization_url;
      } else {
        document.getElementById('subscribeStatus').innerText = 'Error: ' + JSON.stringify(data.error);
      }
    }

    async function loadUsage() {
      const res = await fetch(`${API_BASE}/usage`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      const div = document.getElementById('usageDisplay');
      if (!data.hasSubscription) {
        div.innerHTML = '<p>No active subscription yet.</p>';
        return;
      }
      const percent = Math.min(100, Math.round((data.used / data.totalAllowed) * 100));
      div.innerHTML = `<p style="font-size:14px;color:#666;">${data.used} / ${data.totalAllowed} generations used this plan</p><div class="usage-bar"><div class="usage-fill" style="width:${percent}%"></div></div>`;
    }

    async function loadTemplates() {
      const res = await fetch(`${API_BASE}/templates`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      const listDiv = document.getElementById('templateList');
      listDiv.innerHTML = '';
      if (!data.success || data.templates.length === 0) {
        listDiv.innerHTML = '<p>No templates yet. Create one below.</p>';
        return;
      }
      data.templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.onclick = () => selectTemplate(t.id, t.template_name, card);

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        thumbWrap.appendChild(buildThumbnail(t.html_content, 300, 110));

        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = t.template_name;

        card.appendChild(thumbWrap);
        card.appendChild(label);
        listDiv.appendChild(card);
      });
    }

    function selectTemplate(id, name, el) {
      selectedTemplateId = id;
      document.querySelectorAll('.gallery-card').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('selectedTemplateLabel').innerText = 'Selected: ' + name;
    }

    async function createTemplate() {
      const name = document.getElementById('newTemplateName').value;
      const preset = document.getElementById('presetSelect').value;
      if (!name) {
        document.getElementById('templateStatus').innerText = 'Please enter a template name.';
        return;
      }
      const res = await fetch(`${API_BASE}/templates`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ template_name: name, html_content: PRESETS[preset] })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('templateStatus').innerText = 'Template saved!';
        document.getElementById('newTemplateName').value = '';
        loadTemplates();
      } else {
        document.getElementById('templateStatus').innerText = 'Error: ' + data.error;
      }
    }

    async function generate() {
      if (!selectedTemplateId) {
        document.getElementById('result').innerText = 'Please select a template in the Templates tab first.';
        return;
      }
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const imageUrl = document.getElementById('imageUrl').value;

      document.getElementById('result').innerText = 'Generating... this can take up to 15 seconds.';
      document.getElementById('buyCreditsSection').style.display = 'none';

      const res = await fetch(`${API_BASE}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ template_id: selectedTemplateId, data: { title, price, imageUrl } })
      });
      const data = await res.json();
      if (data.success === false) {
        document.getElementById('result').innerText = 'Error: ' + data.error;
        if (data.needsCredits) document.getElementById('buyCreditsSection').style.display = 'block';
      } else {
        document.getElementById('result').innerHTML = `
          <img src="${data.url}">
          <a href="${data.url}" download="media-engine-image.png">
            <button style="margin-top:10px;">Download Image</button>
          </a>
        `;
        loadUsage();
      }
    }

    async function buyCredits() {
      const res = await fetch(`${API_BASE}/buy-credits`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ credits: 100, amount: 20 })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.authorization_url;
      } else {
        document.getElementById('result').innerText = 'Error: ' + JSON.stringify(data.error);
      }
    }

    loadTemplates();
    loadUsage();
    updatePresetPreview();
  </script>

</body>
</html>
