<!DOCTYPE html>
<html>
<head>
  <title>Media Engine - Log In</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 100px auto; padding: 0 20px; }
    input, button { display: block; width: 100%; margin: 8px 0; padding: 12px; box-sizing: border-box; font-size: 16px; }
    button { background: #2b2d42; color: white; border: none; cursor: pointer; border-radius: 6px; }
    h1 { text-align: center; }
    #authStatus { text-align: center; color: #555; }
  </style>
</head>
<body>

  <h1>Media Engine</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Log In</button>
  <button onclick="signup()" style="background:#eee; color:#2b2d42;">Sign Up</button>
  <p id="authStatus"></p>

  <p style="text-align:center; color:#666; font-size:14px; margin-top:40px;"><a href="/privacy.html" style="color:#666;">Privacy Policy</a> &nbsp;|&nbsp; <a href="/terms.html" style="color:#666;">Terms of Service</a></p>

  <script>
    const API_BASE = window.location.origin;

    async function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch(`${API_BASE}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      document.getElementById('authStatus').innerText = data.success
        ? 'Signed up! Check your email to confirm, then log in.'
        : 'Error: ' + data.error;
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('mediaEngineToken', data.session.access_token);
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('authStatus').innerText = 'Error: ' + data.error;
      }
    }
  </script>

</body>
</html>
